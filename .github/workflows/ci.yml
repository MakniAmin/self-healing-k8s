
name: Self-Healing Kubernetes CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Kubernetes and application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required files
        run: |
          test -f app/Dockerfile
          test -f app/index.html
          test -f app/health
          test -f k8s/namespace.yaml
          test -f k8s/deployment.yaml
          test -f k8s/service.yaml

      - name: Install Kubeconform
        run: |
          curl -fsSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform

      - name: Validate Kubernetes manifests
        run: |
          kubeconform -strict -summary \
            k8s/namespace.yaml \
            k8s/deployment.yaml \
            k8s/service.yaml

      - name: Build application image
        run: |
          docker build \
            -t self-healing-app:${{ github.sha }} \
            ./app

  
  deploy:
    name: Deploy to Kind
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify local cluster
        run: |
          test "$(kubectl config current-context)" = "kind-devops-lab"
          kind get clusters | grep -qx "devops-lab"
          docker info >/dev/null

      - name: Build versioned application image
        run: |
          IMAGE="self-healing-app:${GITHUB_SHA}"
          docker build -t "$IMAGE" ./app
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Load image into Kind
        run: |
          kind load docker-image "$IMAGE" --name devops-lab

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/service.yaml

          sed "s|image: self-healing-app:v2|image: ${IMAGE}|" \
            k8s/deployment.yaml | kubectl apply -f -

      - name: Wait for deployment rollout
        run: |
          kubectl rollout status deployment/self-healing-app \
            -n self-healing --timeout=180s

          kubectl get deployment self-healing-app -n self-healing
          kubectl get pods -n self-healing

      - name: Verify application health
        run: |
          kubectl run ci-health-check \
            --namespace self-healing \
            --image=curlimages/curl:8.12.1 \
            --restart=Never \
            --rm -i \
            --command -- \
            curl --fail --silent --show-error --max-time 10 \
            http://self-healing-service/health

